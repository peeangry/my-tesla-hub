<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a12" />
  <title>My Tesla Hub</title>
  <style>
    :root {
      --bg: #0a0a12;
      --bg2: #12121c;
      --card: #1b1b28;
      --card-hover: #24243a;
      --text: #f2f2f7;
      --muted: #8a8aa0;
      --accent: #4da3ff;
      --danger: #ff5a5f;
      --radius: 22px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #1a1a2e 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 30px;
    }

    .clock {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .clock .time {
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }
    .clock .date {
      font-size: clamp(15px, 2.2vw, 22px);
      color: var(--muted);
      font-weight: 500;
    }
    .greeting {
      font-size: clamp(14px, 2vw, 18px);
      color: var(--muted);
      margin-top: 8px;
    }

    .header-actions { display: flex; gap: 12px; }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn.primary { background: var(--accent); color: #04121f; border-color: transparent; }
    .btn.editing { background: var(--accent); color: #04121f; }

    /* ---------- Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      aspect-ratio: 1 / 1;
      background: var(--card);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
      overflow: hidden;
    }
    .tile:active { transform: scale(0.94); background: var(--card-hover); }
    @media (hover:hover) { .tile:hover { background: var(--card-hover); box-shadow: 0 10px 30px rgba(0,0,0,0.4); } }

    .tile .icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .tile .label {
      font-size: clamp(15px, 1.6vw, 18px);
      font-weight: 600;
      text-align: center;
      padding: 0 8px;
    }

    /* Add tile */
    .tile.add {
      border: 2px dashed rgba(255,255,255,0.18);
      background: transparent;
    }
    .tile.add .icon { background: rgba(255,255,255,0.06); font-weight: 300; }

    /* Remove badge (edit mode) */
    .tile .remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      border: none;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }
    body.edit-mode .tile.app .remove { display: flex; }
    body.edit-mode .tile.app { animation: wobble .35s ease infinite alternate; }
    @keyframes wobble { from { transform: rotate(-0.6deg); } to { transform: rotate(0.6deg); } }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 34px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    footer .safety { color: #d8a34a; }

    /* ---------- Modal ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal {
      width: 100%;
      max-width: 460px;
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 26px;
    }
    .modal h2 { margin: 0 0 18px; font-size: 22px; }
    .modal label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
    .modal input {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--card);
      color: var(--text);
    }
    .modal input:focus { outline: 2px solid var(--accent); }
    .modal .row { display: flex; gap: 12px; margin-top: 22px; }
    .modal .row .btn { flex: 1; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="clock">
          <span class="time" id="time">--:--</span>
          <span class="date" id="date"></span>
        </div>
        <div class="greeting" id="greeting">ยินดีต้อนรับ</div>
      </div>
      <div class="header-actions">
        <button class="btn" id="editBtn">แก้ไข</button>
      </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      <div class="safety">⚠️ เพื่อความปลอดภัย ควรตั้งค่า/กดใช้งานขณะจอดหรือให้ผู้โดยสารช่วย — โปรดขับขี่โดยมีสมาธิ</div>
      <div style="margin-top:8px">My Tesla Hub · เปิดจากเบราว์เซอร์ในรถ Tesla</div>
    </footer>
  </div>

  <!-- Add/Edit modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">เพิ่มแอป</h2>
      <label for="appName">ชื่อแอป</label>
      <input id="appName" type="text" placeholder="เช่น YouTube Music" autocomplete="off" />
      <label for="appUrl">ลิงก์ (URL)</label>
      <input id="appUrl" type="url" placeholder="https://..." inputmode="url" autocomplete="off" />
      <label for="appIcon">ไอคอน (อีโมจิ 1 ตัว — ไม่ใส่ก็ได้)</label>
      <input id="appIcon" type="text" placeholder="🚗" maxlength="4" autocomplete="off" />
      <div class="row">
        <button class="btn" id="cancelBtn">ยกเลิก</button>
        <button class="btn primary" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       แก้ไขรายการแอปเริ่มต้นได้ที่นี่ (หรือกดปุ่ม "แก้ไข" บนหน้าจอเพื่อ
       เพิ่ม/ลบแอปเองจากในรถ โดยไม่ต้องแตะโค้ด)

       รูปแบบ: { name, url, icon (อีโมจิ), color (สีพื้นไอคอน) }
    ===================================================================== */
    const DEFAULT_APPS = [
      { name: "YouTube",     url: "https://www.youtube.com",        icon: "📺", color: "#FF0000" },
      { name: "Netflix",     url: "https://www.netflix.com",        icon: "🎬", color: "#E50914" },
      { name: "Disney+ Hotstar", url: "https://www.hotstar.com/th", icon: "✨", color: "#1a3fb8" },
      { name: "TrueID",      url: "https://www.trueid.net",         icon: "🔴", color: "#E4002B" },
      { name: "AIS PLAY",    url: "https://aisplay.ais.th",         icon: "📱", color: "#7AC143" },
      { name: "Twitch",      url: "https://www.twitch.tv",          icon: "🎮", color: "#9146FF" },
      { name: "Spotify",     url: "https://open.spotify.com",       icon: "🎵", color: "#1DB954" },
      { name: "Google Maps", url: "https://www.google.com/maps",    icon: "🗺️", color: "#34A853" },
      { name: "เสียงเครื่องยนต์", url: "https://peeangry.github.io/ev-active-sound/", icon: "🔊", color: "#ff7a18" },
      { name: "ChatGPT",     url: "https://chatgpt.com",            icon: "🤖", color: "#10A37F" },
      { name: "Claude",      url: "https://claude.ai",              icon: "🧠", color: "#D97757" },
      { name: "Google",      url: "https://www.google.com",         icon: "🔍", color: "#4285F4" },
    ];

    const STORAGE_KEY = "myTeslaHub.apps.v1";
    const grid = document.getElementById("grid");
    const body = document.body;

    /* ---------- โหลด/บันทึกรายการ ---------- */
    function loadApps() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return DEFAULT_APPS.slice();
    }
    function saveApps(apps) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch (e) {}
    }

    let apps = loadApps();

    /* ---------- วาดกริด ---------- */
    function render() {
      grid.innerHTML = "";
      apps.forEach((app, i) => {
        const a = document.createElement("a");
        a.className = "tile app";
        a.href = app.url;
        a.rel = "noopener";
        // เปิดในแท็บเดิม กดปุ่มย้อนกลับของเบราว์เซอร์ Tesla เพื่อกลับหน้า launcher

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.style.background = app.color || "#333";
        icon.textContent = app.icon || (app.name ? app.name[0] : "•");

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = app.name;

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "ลบ " + app.name);
        remove.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          apps.splice(i, 1);
          saveApps(apps);
          render();
        });

        a.appendChild(remove);
        a.appendChild(icon);
        a.appendChild(label);

        // ในโหมดแก้ไข: กดที่ไทล์ไม่ให้เปิดลิงก์
        a.addEventListener("click", (e) => {
          if (body.classList.contains("edit-mode")) e.preventDefault();
        });

        grid.appendChild(a);
      });

      // ไทล์ "เพิ่มแอป"
      const add = document.createElement("div");
      add.className = "tile add";
      add.innerHTML = '<div class="icon">+</div><div class="label">เพิ่มแอป</div>';
      add.addEventListener("click", openModal);
      grid.appendChild(add);
    }

    /* ---------- โหมดแก้ไข ---------- */
    const editBtn = document.getElementById("editBtn");
    editBtn.addEventListener("click", () => {
      body.classList.toggle("edit-mode");
      const on = body.classList.contains("edit-mode");
      editBtn.textContent = on ? "เสร็จสิ้น" : "แก้ไข";
      editBtn.classList.toggle("editing", on);
    });

    /* ---------- Modal เพิ่มแอป ---------- */
    const overlay = document.getElementById("overlay");
    const nameIn = document.getElementById("appName");
    const urlIn = document.getElementById("appUrl");
    const iconIn = document.getElementById("appIcon");

    function openModal() {
      nameIn.value = ""; urlIn.value = ""; iconIn.value = "";
      overlay.classList.add("show");
      setTimeout(() => nameIn.focus(), 50);
    }
    function closeModal() { overlay.classList.remove("show"); }

    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

    document.getElementById("saveBtn").addEventListener("click", () => {
      const name = nameIn.value.trim();
      let url = urlIn.value.trim();
      if (!name || !url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      const palette = ["#4da3ff", "#ff7a18", "#1DB954", "#E50914", "#9146FF", "#f6c343"];
      apps.push({
        name,
        url,
        icon: iconIn.value.trim() || name[0].toUpperCase(),
        color: palette[apps.length % palette.length],
      });
      saveApps(apps);
      render();
      closeModal();
    });

    /* ---------- นาฬิกา + คำทักทาย ---------- */
    function pad(n) { return n < 10 ? "0" + n : n; }
    const days = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
    const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    function tick() {
      const d = new Date();
      document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
      document.getElementById("date").textContent =
        "วัน" + days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()] + " " + (d.getFullYear() + 543);
      const h = d.getHours();
      let g = "สวัสดี";
      if (h < 12) g = "อรุณสวัสดิ์ ☀️";
      else if (h < 17) g = "สวัสดีตอนบ่าย";
      else g = "สวัสดีตอนเย็น 🌙";
      document.getElementById("greeting").textContent = g + " · ขับขี่ปลอดภัยนะครับ";
    }

    render();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
